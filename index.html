<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 微信全屏与防缩放适配 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a0212" />
<title>💗 致最爱的落落公主</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    overflow:hidden;
    background:#0f020a;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #bg{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 112%, rgba(255,60,130,.62) 0%, rgba(255,60,130,0) 70%),
      radial-gradient(ellipse 70% 50% at 12% 8%,  rgba(255,120,180,.20) 0%, rgba(255,120,180,0) 70%),
      radial-gradient(ellipse 70% 50% at 90% 22%, rgba(170,60,255,.20) 0%, rgba(170,60,255,0) 70%),
      linear-gradient(165deg,#1e0313 0%,#2c0619 42%,#15020d 100%);
  }
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
  
  /* 顶部文字层 */
  .ui{
    position:absolute;left:0;right:0;top:12%;
    text-align:center;pointer-events:none;padding:0 24px;
    z-index:20;
    animation:up 1.6s cubic-bezier(.22,1,.36,1) .3s both;
  }
  .title{
    font-size:23px;font-weight:600;letter-spacing:.32em;
    color:#ffe2ee;
    text-shadow:0 0 18px rgba(255,70,140,.95), 0 0 46px rgba(255,30,100,.7), 0 0 90px rgba(255,30,100,.45);
    animation:breathe 3.2s ease-in-out infinite;
  }
  .sub{
    margin-top:18px;font-size:12.5px;letter-spacing:.26em;
    color:rgba(255,196,220,.72);
    animation:blink 2.6s ease-in-out infinite;
  }

  /* ==========================================
     🎈 新增：爱心上方的自定义文本显示区域
     ========================================== */
  .custom-message {
    position: absolute;
    left: 50%;
    /* 调整这里的 top 值可以控制文字在屏幕上的上下位置 */
    top: 38%; 
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 320px;
    text-align: center;
    z-index: 15;
    pointer-events: none;
    animation: msgFloat 4s ease-in-out infinite;
  }

  .custom-message p {
    font-size: 16px;
    line-height: 1.8;
    color: #ffd1e3;
    letter-spacing: 0.1em;
    text-shadow: 0 0 12px rgba(255, 100, 150, 0.8), 0 0 24px rgba(255, 50, 100, 0.5);
    font-weight: 500;
  }

  /* 文字浮动动画 */
  @keyframes msgFloat {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, -55%); }
  }

  /* 中心动画场景容器 */
  .center-scene {
    position: absolute;
    left: 50%;
    top: 60%; /* 稍微下移，给上方文字留空间 */
    transform: translate(-50%, -50%);
    width: 320px;
    height: 240px;
    z-index: 10;
    pointer-events: none;
    animation: floatScene 4s ease-in-out infinite;
  }
  
  @keyframes up{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
  @keyframes blink{0%,100%{opacity:.55;}50%{opacity:1;}}
  
  @keyframes floatScene {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, -52%); }
  }

  /* ---------------- 核心动画 ---------------- */
  
  /* 爱心强烈跳动 */
  .big-heart {
    transform-origin: 160px 140px;
    animation: heartbeat 1.2s ease-in-out infinite;
  }
  
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.08); }
    30% { transform: scale(1); }
    45% { transform: scale(1.04); }
    60% { transform: scale(1); }
  }

  /* 手臂随心跳微微上抬 */
  .boy-arms, .girl-arms {
    animation: armsLift 1.2s ease-in-out infinite;
  }
  @keyframes armsLift {
    0%, 100% { transform: translateY(0); }
    15% { transform: translateY(-3px); }
    30% { transform: translateY(0); }
    45% { transform: translateY(-1.5px); }
    60% { transform: translateY(0); }
  }

</style>
</head>
<body>
<div id="bg"></div>
<canvas id="cv"></canvas>

<!-- ==============================================
     ✍️ 在这里修改你想要显示的文字内容
     ============================================== -->
<div class="custom-message">
  <!-- 可以写一句情话，如果太长可以换行，或者加多个 <p> -->
  <p>我既然选择了喜欢你，哪有那么容易放弃，我不是图新鲜感的人，我对你的爱只会越来越深，自从你的出现，我的心里有了一个日夜可以想念的人，人海之中好不容易遇见你，纵使前路万般艰难，我也不愿意就这样把你弄丢，也希望你千万不要丢下我一个人。<br>这颗跳动的心，永远只为你。</p>
</div>

<!-- 中心场景 SVG -->
<svg class="center-scene" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 爱心渐变 -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#ff2a5f" />
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 大爱心背后的光晕 -->
  <circle cx="160" cy="120" r="60" fill="rgba(255, 100, 150, 0.15)" filter="url(#glow)" />

  <!-- ================= 中间：跳动的巨大爱心 ================= -->
  <g class="big-heart">
    <path d="M 160 150 
             C 160 125, 125 105, 110 115 
             C 85 130, 95 165, 160 195 
             C 225 165, 235 130, 210 115 
             C 195 105, 160 125, 160 150 Z" 
          fill="url(#heartGrad)" filter="url(#glow)"/>
    <!-- 高光反射 -->
    <ellipse cx="130" cy="130" rx="10" ry="5" fill="rgba(255,255,255,0.5)" transform="rotate(-35 130 130)" />
  </g>

  <!-- ================= 左边：托举的男孩 ================= -->
  <g class="boy" transform="translate(50, 155)">
    <rect x="20" y="65" width="8" height="20" fill="#2e4a6b" rx="3"/>
    <rect x="32" y="65" width="8" height="20" fill="#2e4a6b" rx="3"/>
    <path d="M 15 35 Q 0 60 10 70 L 50 70 Q 60 60 45 35 Z" fill="#5b9bd5" />
    <circle cx="30" cy="15" r="18" fill="#ffe0cc" />
    <path d="M 12 15 Q 12 -2 30 -2 Q 48 -2 48 15 Q 40 5 30 5 Q 20 5 12 15" fill="#2c3e50" />
    <circle cx="22" cy="16" r="2.5" fill="#333" />
    <circle cx="38" cy="16" r="2.5" fill="#333" />
    <circle cx="22" cy="16" r="1" fill="#fff" />
    <circle cx="38" cy="16" r="1" fill="#fff" />
    <circle cx="17" cy="22" r="3" fill="#ff8c9e" opacity="0.6" />
    <circle cx="43" cy="22" r="3" fill="#ff8c9e" opacity="0.6" />
    <path d="M 28 23 Q 30 26 32 23" fill="none" stroke="#ff5c77" stroke-width="1.5" stroke-linecap="round"/>
    
    <g class="boy-arms">
      <path d="M 15 45 Q 0 35 -5 20" fill="none" stroke="#ffe0cc" stroke-width="6" stroke-linecap="round" />
      <path d="M 45 45 Q 60 25 75 10" fill="none" stroke="#ffe0cc" stroke-width="6" stroke-linecap="round" />
      <circle cx="-5" cy="20" r="4" fill="#ffe0cc" />
      <circle cx="75" cy="10" r="4" fill="#ffe0cc" />
    </g>
  </g>

  <!-- ================= 右边：托举的女孩 ================= -->
  <g class="girl" transform="translate(200, 155)">
    <rect x="22" y="65" width="6" height="20" fill="#ffe0cc" rx="3"/>
    <rect x="32" y="65" width="6" height="20" fill="#ffe0cc" rx="3"/>
    <path d="M 15 35 Q 0 70 10 80 L 50 80 Q 60 70 45 35 Z" fill="#ff9ebc" />
    <circle cx="30" cy="15" r="18" fill="#ffe0cc" />
    <path d="M 12 15 Q 12 -2 30 -2 Q 48 -2 48 15 Q 40 5 30 5 Q 20 5 12 15" fill="#8b5a2b" />
    <path d="M 10 15 Q 0 30 5 45 Q 15 35 12 20" fill="#8b5a2b" />
    <path d="M 50 15 Q 60 30 55 45 Q 45 35 48 20" fill="#8b5a2b" />
    <path d="M 20 16 Q 23 13 26 16" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <path d="M 34 16 Q 37 13 40 16" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="22" r="3" fill="#ff8c9e" opacity="0.6" />
    <circle cx="45" cy="22" r="3" fill="#ff8c9e" opacity="0.6" />
    <path d="M 28 23 Q 30 26 32 23" fill="none" stroke="#ff5c77" stroke-width="1.5" stroke-linecap="round"/>

    <g class="girl-arms">
      <path d="M 15 45 Q 0 25 -15 10" fill="none" stroke="#ffe0cc" stroke-width="6" stroke-linecap="round" />
      <path d="M 45 45 Q 60 35 65 20" fill="none" stroke="#ffe0cc" stroke-width="6" stroke-linecap="round" />
      <circle cx="-15" cy="10" r="4" fill="#ffe0cc" />
      <circle cx="65" cy="20" r="4" fill="#ffe0cc" />
    </g>
  </g>
</svg>

<!-- 顶部文字 -->
<div class="ui">
  <div class="title">致 最 爱 的 落 落 公 主 ~</div>
  <div class="sub">轻 触 屏 幕 · 让 爱 飞 起 来</div>
</div>

<script>
(function () {
  'use strict';

  var cv  = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var UNIT = [];
  (function () {
    var N = 72;
    for (var i = 0; i <= N; i++) {
      var t  = i / N * Math.PI * 2;
      var mx = 16 * Math.pow(Math.sin(t), 3);
      var my = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      UNIT.push([mx / 22, -my / 22 - 0.273]);
    }
  })();

  var SPR_SIZE = 300, SPR_H = 140;
  var HUES = [300, 318, 332, 342, 350, 356, 8];

  function makeSprite(hue) {
    var c = document.createElement('canvas');
    c.width = c.height = SPR_SIZE;
    var g = c.getContext('2d');
    g.translate(SPR_SIZE / 2, SPR_SIZE / 2);

    g.beginPath();
    for (var i = 0; i < UNIT.length; i++) {
      var x = UNIT[i][0] * SPR_H, y = UNIT[i][1] * SPR_H;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();

    g.shadowColor = 'hsla(' + hue + ',100%,60%,1)';
    g.shadowBlur  = 34;
    g.fillStyle   = 'hsla(' + hue + ',100%,60%,1)';
    g.fill();
    g.fill();

    g.shadowBlur = 10;
    g.fillStyle  = 'hsla(' + hue + ',100%,73%,1)';
    g.fill();

    g.shadowBlur = 0;
    g.globalAlpha = 0.55;
    g.fillStyle = 'hsla(' + hue + ',100%,95%,1)';
    g.beginPath();
    g.ellipse(-SPR_H * 0.22, -SPR_H * 0.19, SPR_H * 0.075, SPR_H * 0.052, -0.6, 0, Math.PI * 2);
    g.fill();

    return c;
  }

  var SPRITES = HUES.map(makeSprite);
  var SPR_RATIO = SPR_SIZE / SPR_H;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });

  var hearts = [];
  var MAX_HEARTS = 520;
  var spawnAcc = 0;

  function pickSprite() {
    return SPRITES[(Math.random() * SPRITES.length) | 0];
  }

  function spawnRising() {
    if (hearts.length >= MAX_HEARTS) return;
    var size = 12 + Math.random() * 26;
    hearts.push({
      x: Math.random() * W,
      y: H + size * 1.6,
      vx: (Math.random() - 0.5) * 0.45,
      vy: -(0.9 + Math.random() * 1.7),
      grav: -0.003,
      drag: 1,
      rot: (Math.random() - 0.5) * 0.7,
      vr: (Math.random() - 0.5) * 0.02,
      size: size,
      age: 0,
      ttl: 900,
      fadeIn: 30,
      maxAlpha: 0.45 + Math.random() * 0.5,
      alpha: 0,
      spr: pickSprite(),
      wobAmp: 0.4 + Math.random() * 1.0,
      wobFreq: 0.015 + Math.random() * 0.03,
      wobPhase: Math.random() * 6.283
    });
  }

  function burst(x, y, count, power) {
    power = power || 1;
    for (var i = 0; i < count; i++) {
      if (hearts.length >= MAX_HEARTS * 1.6) break;
      var ang = Math.random() * Math.PI * 2;
      var spd = (2.5 + Math.random() * 8) * power;
      var size = 10 + Math.random() * 26;
      hearts.push({
        x: x + (Math.random() - 0.5) * 22,
        y: y + (Math.random() - 0.5) * 22,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1.6,
        grav: 0.055,
        drag: 0.977,
        rot: Math.random() * 6.283,
        vr: (Math.random() - 0.5) * 0.3,
        size: size,
        age: 0,
        ttl: 70 + Math.random() * 55,
        fadeIn: 5,
        maxAlpha: 0.85 + Math.random() * 0.15,
        alpha: 0,
        spr: pickSprite(),
        wobAmp: 0,
        wobFreq: 0,
        wobPhase: 0
      });
    }
  }

  function update(dt) {
    spawnAcc -= dt;
    while (spawnAcc <= 0) {
      spawnRising();
      spawnAcc += 5 + Math.random() * 9;
    }

    var n = 0;
    for (var i = 0; i < hearts.length; i++) {
      var p = hearts[i];
      p.age += dt;

      if (p.wobAmp) {
        p.x += Math.sin(p.age * p.wobFreq + p.wobPhase) * p.wobAmp * dt;
      }

      p.vy += p.grav * dt;
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;

      if (p.drag !== 1) {
        var d = Math.pow(p.drag, dt);
        p.vx *= d;
        p.vy *= d;
      }

      p.rot += p.vr * dt;

      var a = p.maxAlpha;
      if (p.age < p.fadeIn) a *= p.age / p.fadeIn;
      var t0 = p.ttl * 0.65;
      if (p.age > t0) a *= Math.max(0, 1 - (p.age - t0) / (p.ttl - t0));
      p.alpha = a;

      var dead = p.age > p.ttl || p.y < -p.size * 3 || p.y > H + p.size * 3 + 320;
      if (!dead) hearts[n++] = p;
    }
    hearts.length = n;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < hearts.length; i++) {
      var p = hearts[i];
      if (p.alpha <= 0.012) continue;

      var d = p.size * SPR_RATIO;
      ctx.globalAlpha = p.alpha > 1 ? 1 : p.alpha;

      if (p.rot) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.drawImage(p.spr, -d * 0.5, -d * 0.5, d, d);
        ctx.restore();
      } else {
        ctx.drawImage(p.spr, p.x - d * 0.5, p.y - d * 0.5, d, d);
      }
    }
    ctx.globalAlpha = 1;
  }

  var last = 0;
  function loop(now) {
    if (!last) last = now;
    var dt = (now - last) / 16.667;
    if (dt > 3) dt = 3;
    last = now;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function tapAt(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    burst(clientX - r.left, clientY - r.top, 26, 1);
  }

  var isTouch = false;
  cv.addEventListener('touchstart', function (e) {
    isTouch = true;
    var t = e.changedTouches[0];
    tapAt(t.clientX, t.clientY);
    if (e.cancelable) e.preventDefault(); 
  }, { passive: false });

  cv.addEventListener('mousedown', function (e) {
    if (isTouch) return;
    tapAt(e.clientX, e.clientY);
  });

  function start() {
    resize();
    requestAnimationFrame(loop);

    for (var i = 0; i < 7; i++) {
      (function (k) {
        setTimeout(function () {
          burst(W * (0.25 + Math.random() * 0.5), H + 30, 14, 1.45);
        }, k * 150);
      })(i);
    }
  }

  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>
</body>
</html>
